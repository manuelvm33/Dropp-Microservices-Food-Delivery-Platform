name: Deploy Dropp to EC2

on:
  push:
    branches: [main]

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  AWS_REGION: us-east-1

jobs:
  code-quality:
    name: Test & SonarCloud Analysis
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend/user-service
          - backend/restaurant-listing-service
          - backend/food-catalog-service
          - backend/order-service          

    steps:
      - uses: actions/checkout@v4
        with:          
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and generate JaCoCo report
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean verify -Dspring-boot.run.profiles=local

      - name: SonarCloud Scan
        working-directory: ${{ matrix.service }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=vars.SONAR_ORG \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend images
        run: |
          declare -A services=(
            ["backend/eureka-server"]="dropp/eureka"
            ["backend/api-gateway"]="dropp/api-gateway"
            ["backend/restaurant-listing-service"]="dropp/restaurant-listing-service"
            ["backend/food-catalog-service"]="dropp/food-catalogue-service"
            ["backend/user-service"]="dropp/user-service"
            ["backend/order-service"]="dropp/order-service"
          )
          for folder in "${!services[@]}"; do
            ecr_name="${services[$folder]}"
            echo "Building $folder → $ecr_name"
            docker build -t $ECR_REGISTRY/$ecr_name:latest ./$folder
            docker push $ECR_REGISTRY/$ecr_name:latest
          done

      - name: Build and push frontend image
        run: |
          echo "Building with EC2_HOST: ${{ secrets.EC2_HOST }}"
          docker build \
            --build-arg EC2_HOST=${{ secrets.EC2_HOST }} \
            -t $ECR_REGISTRY/dropp/frontend:latest \
            ./frontend/dropp
          docker push $ECR_REGISTRY/dropp/frontend:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY
          command_timeout: 30m
          script: |
            mkdir -p ~/app
            cat > ~/app/docker-compose.yml << 'EOF'
            version: '3.8'
            networks:
              dropp-network:
                driver: bridge
            services:
              eureka:
                image: ECRREGISTRY/dropp/eureka:latest
                container_name: eureka
                ports:
                  - "8761:8761"
                networks:
                  - dropp-network
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 5
              api-gateway:
                image: ECRREGISTRY/dropp/api-gateway:latest
                container_name: api-gateway
                ports:
                  - "8081:8080"
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
              restaurant-listing-service:
                image: ECRREGISTRY/dropp/restaurant-listing-service:latest
                container_name: restaurant-listing-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
              food-catalogue-service:
                image: ECRREGISTRY/dropp/food-catalogue-service:latest
                container_name: food-catalogue-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
              user-service:
                image: ECRREGISTRY/dropp/user-service:latest
                container_name: user-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
              order-service:
                image: ECRREGISTRY/dropp/order-service:latest
                container_name: order-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
              frontend:
                image: ECRREGISTRY/dropp/frontend:latest
                container_name: frontend
                ports:
                  - "80:80"
                networks:
                  - dropp-network
                depends_on:
                  - api-gateway
            EOF
            sed -i "s|ECRREGISTRY|$ECR_REGISTRY|g" ~/app/docker-compose.yml
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin $ECR_REGISTRY
            cd ~/app
            nohup bash -c "docker compose down && docker system prune -f && docker compose pull && docker compose up -d --remove-orphans" > ~/deploy.log 2>&1 &
            echo "Deploy PID: $!"