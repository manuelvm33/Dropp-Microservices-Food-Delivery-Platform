name: Deploy Dropp to EC2

on:
  push:
    branches: [main]

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend images
        run: |
          declare -A services=(
            ["backend/eureka-server"]="dropp/eureka"
            ["backend/api-gateway"]="dropp/api-gateway"
            ["backend/restaurant-listing-service"]="dropp/restaurant-listing-service"
            ["backend/food-catalog-service"]="dropp/food-catalogue-service"
            ["backend/user-service"]="dropp/user-service"
            ["backend/order-service"]="dropp/order-service"
          )
          for folder in "${!services[@]}"; do
            ecr_name="${services[$folder]}"
            echo "Building $folder → $ecr_name"
            docker build -t $ECR_REGISTRY/$ecr_name:latest ./$folder
            docker push $ECR_REGISTRY/$ecr_name:latest
          done

      - name: Build and push frontend image
        run: |
          echo "Building with EC2_HOST: ${{ secrets.EC2_HOST }}"
          docker build \
            --build-arg EC2_HOST=${{ secrets.EC2_HOST }} \
            -t $ECR_REGISTRY/dropp/frontend:latest \
            ./frontend/dropp
          docker push $ECR_REGISTRY/dropp/frontend:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY
          script: |
            mkdir -p ~/app

            cat > ~/app/docker-compose.yml << COMPOSE
            version: '3.8'

            networks:
              dropp-network:
                driver: bridge

            services:
              eureka:
                image: ${ECR_REGISTRY}/dropp/eureka:latest
                container_name: eureka
                ports:
                  - "8761:8761"
                networks:
                  - dropp-network
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 5

              api-gateway:
                image: ${ECR_REGISTRY}/dropp/api-gateway:latest
                container_name: api-gateway
                ports:
                  - "8081:8080"
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod

              restaurant-listing-service:
                image: ${ECR_REGISTRY}/dropp/restaurant-listing-service:latest
                container_name: restaurant-listing-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod

              food-catalogue-service:
                image: ${ECR_REGISTRY}/dropp/food-catalogue-service:latest
                container_name: food-catalogue-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod

              user-service:
                image: ${ECR_REGISTRY}/dropp/user-service:latest
                container_name: user-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod

              order-service:
                image: ${ECR_REGISTRY}/dropp/order-service:latest
                container_name: order-service
                networks:
                  - dropp-network
                depends_on:
                  eureka:
                    condition: service_healthy
                environment:
                  - SPRING_PROFILES_ACTIVE=prod

              frontend:
                image: ${ECR_REGISTRY}/dropp/frontend:latest
                container_name: frontend
                ports:
                  - "80:80"
                networks:
                  - dropp-network
                depends_on:
                  - api-gateway
            COMPOSE

            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin $ECR_REGISTRY
            cd ~/app
            docker compose pull
            docker compose up -d --remove-orphans