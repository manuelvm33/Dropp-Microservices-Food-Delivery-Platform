spring:
  config:
    import: "aws-parameterstore:/dropp/prod/"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${eureka-url}
  instance:
    prefer-ip-address: true